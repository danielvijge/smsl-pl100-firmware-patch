name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          python3 build_patch.py --version "$GITHUB_REF_NAME" IAP_PL100_1v1_b250219.hex "IAP_PL100_1v1_b250219_patch_${GITHUB_REF_NAME}.hex"

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "IAP_PL100_1v1_b250219_patch_${GITHUB_REF_NAME}.hex" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
